<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Davinese</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/react-native-web@0.18.10/dist/index.umd.js"></script>
  <script>
    const { AppRegistry, Text } = ReactNativeWeb;

    function App() {
      return React.createElement(Text, {
        style: {
          fontFamily: "-apple-system, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif",
          fontWeight: '900',
          fontSize: 48
        }
      }, 'Davinese');
    }

    AppRegistry.registerComponent('Davinese', () => App);
    AppRegistry.runApplication('Davinese', { rootTag: document.getElementById('root') });
  </script>
</body>
</html>
